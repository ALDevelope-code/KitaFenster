services:
  verwaltung:
    image: "${KITAFENSTER_IMAGE:-ghcr.io/aldevelope-code/kitafenster}:${KITAFENSTER_VERSION:-0.2.1}"
    user: "${NAS_UID:-10001}:${NAS_GID:-10001}"
    group_add:
      - "${NAS_READ_GID:-${NAS_GID:-10001}}"
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8088:8088"
    environment:
      DATA_DIR: /data
      NAS_ROOT: /nas
      SCAN_SECONDS: "60"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      # Ohne gesetzte Variable bleibt ein bestehendes Konto unverändert.
      ADMIN_PASSWORD:
      TZ: Europe/Berlin
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${NAS_PATH:-./demo-nas}:/nas:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# Vorlage für einen dedizierten Bilderrahmen-Pi.
# kitatransfer: eigenes Konto ohne Login-Shell und sudo; siehe docs/TRANSFER-SAMBA.md.
[global]
    workgroup = WORKGROUP
    server role = standalone server
    security = user
    map to guest = Never
    unix password sync = no
    server min protocol = SMB2_10
    load printers = no
    disable spoolss = yes

[kitafenster-transfer]
    path = /srv/kitafenster-transfer
    valid users = kitatransfer
    read only = no
    guest ok = no
    browseable = yes
    create mask = 0600
    directory mask = 0700
    follow symlinks = no
    wide links = no

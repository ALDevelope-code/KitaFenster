[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kitafenster"
version = "0.2.5"
description = "Der lokale digitale Bilderrahmen für Kitas"
authors = [{name = "Andy Lungfiel"}]
requires-python = ">=3.11"
dependencies = []
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pillow>=11,<13", "pypdfium2>=4.30,<6", "python-multipart>=0.0.20,<1", "tzdata>=2025.1"]
player = ["pygame>=2.6,<3", "tzdata>=2025.1"]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["server*", "player*", "shared*"]

[tool.setuptools.package-data]
server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
